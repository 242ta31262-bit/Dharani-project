<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>

    <style>
        body{
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container{
            width: 400px;
            background: white;
            padding: 20px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result{
            margin-top: 20px;
            font-size: 20px;
            text-align: center;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Performance Predictor</h2>

    <input type="number" id="attendance" placeholder="Enter Attendance %">

    <input type="number" id="marks" placeholder="Enter Internal Marks">

    <button onclick="predictResult()">Predict Result</button>

    <div id="result"></div>

</div>

<script>

function predictResult(){

    let attendance = document.getElementById("attendance").value;

    let marks = document.getElementById("marks").value;

    let result = "";

    if(attendance >= 75 && marks >= 40){
        result = "Student Will PASS";
    }
    else{
        result = "Student May FAIL";
    }

    document.getElementById("result").innerHTML = result;
}

</script>

</body>
</html>
